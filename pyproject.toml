[project]
name = "due-diligent"
version = "0.1.0"
description = "Stock screener and filings research assistant"
requires-python = ">=3.13"
dependencies = ["pandas==3.0.6","yfinance==1.7.0","boto3==1.43.115"]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
due-diligent = "due_diligent.cli:main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"
